name: v2 build and test
on:
  push:
    branches: [v2-single-file, master]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - run: node --test 'tests/*.test.mjs'
      - run: git diff --exit-code -- dist/index.html || (echo "dist/index.html is stale: run python3 build.py and commit" && exit 1)
